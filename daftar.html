<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran - Digitech Funclub</title>

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="logo.jpg">

    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Reset & Variabel */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        /* Tema Cyber Dark (Default) */
        body.theme-dark {
            --bg-deep: #070913;
            --bg-card: #111827;
            --bg-navbar: rgba(7, 9, 19, 0.9);
            --primary: #00f0ff;
            --secondary: #7928ca;
            --accent: #ff007f;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-cyber: rgba(0, 240, 255, 0.2);
            --glow-cyber: 0 0 20px rgba(0, 240, 255, 0.15);
            --input-bg: #070913;
            --footer-bg: #04050a;
        }

        /* Tema Cyber Light */
        body.theme-light {
            --bg-deep: #f0f4f8;
            --bg-card: #ffffff;
            --bg-navbar: rgba(240, 244, 248, 0.95);
            --primary: #0077ff;
            --secondary: #7928ca;
            --accent: #ff007f;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-cyber: rgba(0, 119, 255, 0.25);
            --glow-cyber: 0 4px 20px rgba(0, 119, 255, 0.12);
            --input-bg: #f8fafc;
            --footer-bg: #e2e8f0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.6;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Header & Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 6%;
            background-color: var(--bg-navbar);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-cyber);
            gap: 1.5rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            text-decoration: none;
        }

        .logo-container img {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--primary);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-main);
            white-space: nowrap;
        }

        .neon-dot {
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.8rem;
            margin-left: auto;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: 0.3s;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links .nav-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            padding: 0.5rem 1.4rem;
            border-radius: 25px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        /* Tombol Switch Tema */
        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-cyber);
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: var(--glow-cyber);
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            border-color: var(--primary);
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            color: var(--primary);
            cursor: pointer;
        }

        /* Form Pendaftaran Section */
        .form-page-section {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8rem 1rem 4rem;
        }

        .kontak-container {
            width: 100%;
            max-width: 550px;
            background-color: var(--bg-card);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid var(--border-cyber);
            box-shadow: var(--glow-cyber);
            text-align: center;
        }

        .sub-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(0, 240, 255, 0.08);
            color: var(--primary);
            padding: 0.5rem 1.2rem;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--border-cyber);
            box-shadow: var(--glow-cyber);
            margin-bottom: 1rem;
        }

        .kontak-container h2 {
            font-size: 2.2rem;
            margin: 0.3rem 0;
            font-weight: 700;
        }

        .kontak-container p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .join-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: var(--text-main);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--border-cyber);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0.9rem 2.2rem;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--primary);
        }

        /* Footer */
        footer {
            background-color: var(--footer-bg);
            padding: 2rem 6%;
            border-top: 1px solid var(--border-cyber);
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Responsif HP */
        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: var(--bg-navbar);
                padding: 2rem 0;
                text-align: center;
                border-bottom: 1px solid var(--border-cyber);
                margin-left: 0;
            }

            .nav-links.active {
                display: flex;
            }

            .kontak-container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body class="theme-dark">

    <!-- Header / Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo-container">
            <img src="logo.jpg" alt="logo">
            <span class="brand-name">Digitech<span class="neon-dot">.</span>Funclub</span>
        </a>
        <nav class="nav-links" id="navLinks">
            <a href="index.html#home">Beranda</a>
            <a href="index.html#materi">Materi Belajar</a>
            <a href="index.html#fasilitas">Fasilitas</a>
            <a href="index.html#jadwal">Jadwal</a>
            <a href="daftar.html" class="nav-btn">Gabung Sekarang</a>
        </nav>

        <!-- Tombol Switch Tema -->
        <div class="theme-toggle" id="themeToggle" title="Ganti Tema">
            <i class="fas fa-moon" id="themeIcon"></i>
        </div>

        <div class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </div>
    </header>

    <!-- Main Form Section -->
    <section class="form-page-section">
        <div class="kontak-container">
            <span class="sub-badge"><i class="fas fa-user-plus"></i> Pendaftaran Resmi</span>
            <h2>Form Gabung Ekskul</h2>
            <p>Lengkapi data diri di bawah ini untuk terhubung langsung ke WhatsApp pengurus Digitech Funclub!</p>
            
            <form id="joinForm" class="join-form">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Contoh: Budi Santoso" required>
                </div>
                <div class="form-group">
                    <label for="kelas">Kelas / Tingkat</label>
                    <input type="text" id="kelas" placeholder="Contoh: Kelas 9A" required>
                </div>
                <div class="form-group">
                    <label for="minat">Peminat Utama / Keahlian</label>
                    <select id="minat" style="width: 100%; padding: 1rem 1.2rem; border-radius: 12px; border: 1px solid var(--border-cyber); background-color: var(--input-bg); color: var(--text-main); font-size: 0.95rem; outline: none;">
                        <option value="Coding & Pemrograman">Coding & Pemrograman</option>
                        <option value="Hardware Komputer">Hardware Komputer</option>
                        <option value="AI & Teknologi Modern">AI & Teknologi Modern</option>
                        <option value="Desain & Video Editing (Canva)">Desain & Video Editing (Canva)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="whatsapp">Nomor WhatsApp Aktif</label>
                    <input type="tel" id="whatsapp" placeholder="Contoh: 081234567890" required>
                </div>
                <button type="submit" class="btn btn-primary">Kirim Pendaftaran ke WhatsApp <i class="fab fa-whatsapp"></i></button>
            </form>

            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Digitech Funclub. All rights reserved.</p>
    </footer>

    <!-- JavaScript untuk Navigasi, Toggle Tema & WhatsApp Sender -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Toggle Menu Mobile
            const menuToggle = document.getElementById('menuToggle');
            const navLinks = document.getElementById('navLinks');

            if (menuToggle && navLinks) {
                menuToggle.addEventListener('click', () => {
                    navLinks.classList.toggle('active');
                });

                document.querySelectorAll('.nav-links a').forEach(link => {
                    link.addEventListener('click', () => {
                        navLinks.classList.remove('active');
                    });
                });
            }

            // 2. Feature: Ganti Tema (Cyber Dark / Cyber Light)
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const body = document.body;

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                body.className = savedTheme;
                updateIcon(savedTheme === 'theme-light');
            }

            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const isLight = body.classList.contains('theme-light');
                    
                    if (isLight) {
                        body.classList.remove('theme-light');
                        body.classList.add('theme-dark');
                        localStorage.setItem('theme', 'theme-dark');
                        updateIcon(false);
                    } else {
                        body.classList.remove('theme-dark');
                        body.classList.add('theme-light');
                        localStorage.setItem('theme', 'theme-light');
                        updateIcon(true);
                    }
                });
            }

            function updateIcon(isLight) {
                if (themeIcon) {
                    if (isLight) {
                        themeIcon.classList.remove('fa-moon');
                        themeIcon.classList.add('fa-sun');
                    } else {
                        themeIcon.classList.remove('fa-sun');
                        themeIcon.classList.add('fa-moon');
                    }
                }
            }

            // 3. Form Kirim ke WhatsApp
            const joinForm = document.getElementById('joinForm');

            if (joinForm) {
                joinForm.addEventListener('submit', (e) => {
                    e.preventDefault();

                    const nama = document.getElementById('nama').value;
                    const kelas = document.getElementById('kelas').value;
                    const minat = document.getElementById('minat').value;
                    const whatsapp = document.getElementById('whatsapp').value;

                    const nomorWA = "6285731045476";
                    const pesan = `Halo kak! Saya ingin mendaftar ke ekstrakurikuler *Digitech Funclub*.\n\nBerikut data diri saya:\n- *Nama:* ${nama}\n- *Kelas:* ${kelas}\n- *Peminatan:* ${minat}\n- *No. WA:* ${whatsapp}\n\nMohon info selanjutnya ya, terima kasih!`;

                    const urlWA = `https://wa.me/${+6285731045476}?text=${encodeURIComponent(pesan)}`;
                    window.open(urlWA, '_blank');
                    joinForm.reset();
                });
            }
        });
    </script>
</body>
</html>
